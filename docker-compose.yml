services:
  db:
    image: postgres:17
    container_name: riftanalyzer-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: riftanalyzer
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: riftanalyzer

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: